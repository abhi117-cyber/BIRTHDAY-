<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Surprise 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');

:root{
  --pink:#f47792; --pink2:#ffb5c5; --soft:#fff4f7; --dark:#542b38;
  --white:#fff; --shadow:0 20px 60px rgba(120,55,75,.15);
}
*{box-sizing:border-box}
body{margin:0;font-family:"DM Sans",sans-serif;background:#000;color:var(--dark)}
.video{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center}
.phone{width:min(100%,430px);min-height:100vh;background:#fff4f7;overflow:hidden;position:relative}
.screen{display:none;min-height:100vh;position:relative;padding:22px}
.screen.active{display:block}
.top-title{text-align:center;color:white;background:#000;padding:28px 10px 24px;font-size:18px;font-weight:700;letter-spacing:.2px}
.top-title small{display:block;font-size:20px;margin-top:8px}

.bg-hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.heart{position:absolute;font-size:25px;opacity:.5;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px) rotate(8deg)}}

h1,h2,h3,p{margin-top:0}
.serif{font-family:"Playfair Display",serif}
.muted{opacity:.7;font-size:12px}
.center{text-align:center}
.btn{
 border:0;background:linear-gradient(135deg,#ff8da5,#ec5f7c);color:#fff;
 padding:13px 22px;border-radius:999px;font-weight:700;cursor:pointer;
 box-shadow:0 10px 25px rgba(236,95,124,.25);transition:.25s
}
.btn:hover{transform:translateY(-2px)}
.card{background:rgba(255,255,255,.9);border:1px solid #f9d9e1;border-radius:22px;box-shadow:var(--shadow)}

#passcode{padding:0;background:#fff4f7}
.pass-wrap{padding:80px 28px;text-align:center}
.lock{font-size:40px;margin-bottom:8px}
.pass-input{display:flex;justify-content:center;gap:8px;margin:25px 0}
.dot{width:40px;height:44px;border:1px solid #f3cbd5;border-radius:10px;background:white;text-align:center;font-size:22px}
.keypad{max-width:270px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:46px;border:0;border-radius:50%;background:#fff;color:#74424f;font-weight:700;box-shadow:0 5px 16px #eacbd3;cursor:pointer}
.hint{margin-top:18px;color:#a36373;font-size:11px}

.hero{min-height:100vh;background:linear-gradient(150deg,#fff8fa,#ffeaf0);padding:30px 18px}
.nav{display:flex;justify-content:space-between;font-size:11px;color:#ad7180}
.hero-content{text-align:center;padding-top:80px}
.hero h1{font-family:"Playfair Display",serif;font-size:54px;line-height:.9;color:#d86d86;margin:12px 0}
.hero h1 em{display:block;color:#ed9aaa;font-size:37px}
.rose{font-size:50px;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-8px)}}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;width:7px;height:20px;background:#f79aad;opacity:.55;animation:fall 4s linear infinite}
@keyframes fall{from{transform:translateY(-50px) rotate(0)}to{transform:translateY(105vh) rotate(360deg)}}

.story{padding:25px 18px 45px;background:#fff7f9}
.story-head{display:flex;justify-content:space-between;font-size:10px;color:#b16c7b}
.story-main{margin-top:35px}
.story-main h2{font-size:35px;line-height:1.02}
.story-main h2 span{color:#e56d87}
.memory-hero{height:220px;border-radius:24px;margin-top:8px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#ffe3eb 28%,#f5a0b4 70%,#d85d7b 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 45px rgba(180,75,105,.22)}
.memory-orb{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:54px;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.65);box-shadow:0 0 45px rgba(255,255,255,.75);animation:orbPulse 2.4s ease-in-out infinite}
@keyframes orbPulse{50%{transform:scale(1.08);box-shadow:0 0 70px rgba(255,255,255,.9)}}
.sparkle{position:absolute;color:white;font-size:25px;animation:sparkle 2s infinite ease-in-out}.s1{top:35px;left:25%}.s2{right:23%;bottom:45px;animation-delay:.8s}
@keyframes sparkle{50%{opacity:.25;transform:scale(.65) rotate(25deg)}}
.memory-lines{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.08) 23px 24px);transform:scale(1.4)}
.memory-caption{position:absolute;bottom:18px;color:white;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.story-text{font-size:13px;line-height:1.7;color:#79505b;margin-top:18px}
.memory-cards{display:grid;gap:9px;margin:16px 0}.memory-card{display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;background:#fff;border:1px solid #f6d8df;box-shadow:0 7px 20px rgba(120,55,75,.08)}
.memory-icon{font-size:25px;width:42px;height:42px;border-radius:12px;background:#fff0f4;display:flex;align-items:center;justify-content:center}.memory-card strong{font-size:12px}.memory-card p{font-size:10px;line-height:1.45;color:#8a5c68;margin:3px 0}

.memories{padding:24px 16px 50px;background:#fff6f8}
.memories h2{text-align:center;font-family:"Playfair Display",serif;font-size:28px}
.memory-timeline{position:relative;margin:22px 5px 0}.memory-timeline:before{content:"";position:absolute;left:20px;top:10px;bottom:10px;width:2px;background:#f1b8c5}
.timeline-item{display:flex;gap:13px;position:relative;margin-bottom:15px}.timeline-dot{flex:0 0 42px;height:42px;border-radius:50%;background:#fff;border:2px solid #f0a9b9;display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:0 4px 12px rgba(180,75,105,.12)}
.timeline-content{flex:1;background:#fff;border-radius:15px;padding:12px;border:1px solid #f5d9df}.timeline-content span{font-size:8px;letter-spacing:1.5px;color:#d4778e}.timeline-content h3{font-family:"Playfair Display",serif;margin:3px 0;font-size:17px}.timeline-content p{font-size:10px;line-height:1.5;color:#805866;margin:0}
.quote{text-align:center;margin:22px 0;font-family:"Playfair Display",serif;font-style:italic;color:#a45e70}

.modal-bg{position:absolute;inset:0;background:rgba(44,18,25,.58);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:25px;z-index:20}
.modal-bg.show{display:flex}
.modal{background:#fff9fa;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 30px 90px #301620}
.modal .cake{font-size:55px}
.modal h2{font-family:"Playfair Display",serif;font-size:28px}
.modal p{font-size:13px;line-height:1.7;color:#78505b}

.final{padding:30px 18px;background:linear-gradient(145deg,#fff0f4,#ffe0e9);text-align:center;min-height:100vh}
.final h2{font-family:"Playfair Display",serif;font-size:34px;color:#d65d78}
.final-box{margin-top:30px;padding:25px;border-radius:22px;background:#fff;box-shadow:var(--shadow)}
.big-heart{font-size:60px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

.footer-note{text-align:center;color:#9e6976;font-size:10px;margin-top:25px}
</style>
</head>
<body>
<div class="video"><main class="phone">

</body>
</html>
